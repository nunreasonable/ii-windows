[package]
name = "songrec"
version = "0.7.5+win.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
log = "0.4.29"
realfft = "3.5.0"
rustfft = "6.4.1"
byteorder = "1.3.4"
crc32fast = "1.2.0"
base64 = "0.22.1"
rodio = { version = "0.22.2", default-features = false, features = ["hound", "minimp3", "vorbis", "flac"] }
serde_json = "1.0.57"
uuid = { version = "1.23.0", features = ["v4"] }
rand = "0.10.0"
cpal = "0.18.1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
gettext-rs = { path = "stubs/gettext-rs" }

[features]
ffmpeg = []

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
