name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      QT_VERSION: 6.11.2
      RUST_VERSION: 1.97.1
      AQTINSTALL_COMMIT: 076e1659807d0b362a3ed684d54c2e9c775eb9c7
      FONTTOOLS_VERSION: 4.67.0
      MATUGEN_VERSION: 4.1.0
      CLI11_TAG: v2.5.0
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link

    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Check out quickshell and ii at the locked commits
        run: |
          while read -r name url sha; do
            [ -z "$name" ] && continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "$url" "$sha"
            git -C "$name" checkout -q FETCH_HEAD
            git -C "$name" submodule update -q --init --recursive
            echo "$name $(git -C "$name" rev-parse HEAD)"
          done < sources.lock

      - name: Paths
        run: |
          tmp="$(cygpath -m "$RUNNER_TEMP")"
          {
            echo "QT_ROOT=$tmp/qt"
            echo "QT_WIN=$tmp/qt/$QT_VERSION/msvc2022_64"
            echo "CLI11_DIR=$tmp/cli11"
            echo "PYTHON=python"
          } >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          python -m pip install --quiet "aqtinstall @ git+https://github.com/miurahr/aqtinstall@$AQTINSTALL_COMMIT" "fonttools==$FONTTOOLS_VERSION" ninja
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_VERSION"
          clang-cl --version
          cmake --version
          ninja --version
          cargo --version

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-msvc2022_64-qt5compat-qtimageformats-qtpositioning-qtshadertools

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: aqt install-qt windows desktop "$QT_VERSION" win64_msvc2022_64 -m qt5compat qtimageformats qtpositioning qtshadertools -O "$QT_ROOT"

      - name: CLI11
        run: git clone -q --depth 1 --branch "$CLI11_TAG" https://github.com/CLIUtils/CLI11.git "$CLI11_DIR"

      - name: Build quickshell
        run: |
          cmake -S quickshell -B build/qs -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_PREFIX_PATH="$QT_WIN" -DCLI11_INCLUDE_DIR="$CLI11_DIR/include" \
            -DQS_PRODUCT_NAME=ii-windows -DQS_COMPANY_NAME=nunreasonable -DQS_VERSION_FILE="$(cygpath -m "$PWD/VERSION")"
          cmake --build build/qs

      - name: Build the setup
        run: cd installer && cargo build --release --locked --target x86_64-pc-windows-msvc -p ii-windows-setup

      - name: Build matugen
        run: cargo install matugen --version "$MATUGEN_VERSION" --locked --root build/matugen

      - name: Build SongRec
        run: NATIVE=1 tools/songrec/build.sh

      - name: Build MicroTeX
        run: NATIVE=1 tools/microtex/build.sh

      - name: Visual C++ runtime
        run: |
          crt="$(ls -d "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC14*.CRT | tail -n1)"
          echo "runtime from $crt"
          mkdir -p build/vcredist
          for f in msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll vcruntime140.dll vcruntime140_1.dll; do
            cp -f "$crt/$f" build/vcredist/
          done

      - name: Package
        env:
          FONTTOOLS: python -m fontTools
          MATUGEN_EXE: build/matugen/bin/matugen.exe
          VCREDIST_DIR: build/vcredist
          SKIP_SETUP_BUILD: "1"
        run: |
          export QMLCACHEGEN="$QT_WIN/bin/qmlcachegen.exe"
          tools/deploy-ii.sh
          tools/release.sh
          (cd dist/release && sha256sum ii-windows-setup.exe ii-windows-*.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: ii-windows-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/release/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Check out ii at the locked commit
        run: |
          read -r name url sha < <(grep '^ii ' sources.lock)
          git init -q ii
          git -C ii fetch -q --depth 1 "$url" "$sha"
          git -C ii checkout -q FETCH_HEAD
          git -C ii submodule update -q --init --recursive

      - uses: actions/download-artifact@v4
        with:
          name: ii-windows-${{ github.ref_name }}-${{ github.run_number }}
          path: pkg

      - name: List every QML file for the compile check
        run: python tools/qml-compile-check.py ii > pkg/compilecheck.qml

      - name: Smoke test
        shell: powershell
        run: |
          $zip = Get-ChildItem pkg -Filter 'ii-windows-*.zip' | Where-Object Name -notlike '*.sha256' | Select-Object -First 1
          & tools\smoke\ci-smoke.ps1 -Package $zip.FullName -Setup pkg\ii-windows-setup.exe -CompileCheck pkg\compilecheck.qml -Work "$env:RUNNER_TEMP\iiw" -Output "$env:RUNNER_TEMP\iiw\smoke.txt"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.runner }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/iiw/smoke.txt
            ${{ runner.temp }}/iiw/logs/
          if-no-files-found: ignore
